workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    scripts:
      - name: Audit backend SQL parameterization
        script: |
          node backend/scripts/audit-parameterized-sql.mjs
      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Show Xcode version
        script: |
          xcodebuild -version
      - name: Clean DerivedData
        script: |
          rm -rf build/DerivedData
      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          
          MAX_RETRIES=3
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Build attempt $ATTEMPT of $MAX_RETRIES ==="
            
            if xcodebuild clean build \
              -project ZhengHuoJu.xcodeproj \
              -scheme ZhengHuoJu \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/DerivedData \
              -jobs 1 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO \
              SWIFT_ENABLE_BATCH_MODE=NO \
              SWIFT_ENABLE_INCREMENTAL_COMPILATION=NO \
              COMPILER_INDEX_STORE_ENABLE=NO; then
              echo "=== Build succeeded on attempt $ATTEMPT ==="
              exit 0
            fi
            
            echo "=== Build failed on attempt $ATTEMPT, cleaning and retrying... ==="
            rm -rf build/DerivedData
            sleep 5
          done
          
          echo "=== All $MAX_RETRIES attempts failed ==="
          exit 1
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          BAD_FILES="$(find "$APP_PATH" \( -name '*.ps1' -o -name '*.txt' -o -name '*.ts' -o -name '*.yml' -o -name '*.yaml' -o -path '*/backend/*' -o -path '*/devin_diffs/*' \) -print)"
          if [ -n "$BAD_FILES" ]; then
            echo "Unexpected development files found in app bundle:"
            echo "$BAD_FILES"
            exit 1
          fi
          rm -rf build/unsigned-ipa build/ZhengHuoJu-unsigned.ipa
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/unsigned-ipa/Payload/
          (cd build/unsigned-ipa && zip -qry ../ZhengHuoJu-unsigned.ipa Payload)
    artifacts:
      - build/ZhengHuoJu-unsigned.ipa

  ios-simulator-check:
    name: iOS simulator compile check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    scripts:
      - name: Audit backend SQL parameterization
        script: |
          node backend/scripts/audit-parameterized-sql.mjs
      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for iOS simulator
        script: |
          set -euo pipefail
          xcodebuild clean build \
            -project ZhengHuoJu.xcodeproj \
            -scheme ZhengHuoJu \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath build/DerivedData \
            -jobs 2
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/ZhengHuoJu.app
