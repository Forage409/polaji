workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Show Xcode version
        script: |
          xcodebuild -version
      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          xcrun actool --compile build/DerivedData/actool_out --minimum-deployment-target 16.0 --platform iphoneos Assets.xcassets || true
          xcodebuild build \
            -project ZhengHuoJu.xcodeproj \
            -scheme ZhengHuoJu \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          rm -rf build/unsigned-ipa build/ZhengHuoJu-unsigned.ipa
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/unsigned-ipa/Payload/
          (cd build/unsigned-ipa && zip -qry ../ZhengHuoJu-unsigned.ipa Payload)
    artifacts:
      - build/ZhengHuoJu-unsigned.ipa

  ios-simulator-check:
    name: iOS simulator compile check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for iOS simulator
        script: |
          set -euo pipefail
          xcrun actool --compile build/DerivedData/actool_out --minimum-deployment-target 16.0 --platform iphoneos Assets.xcassets || true
          xcodebuild build \
            -project ZhengHuoJu.xcodeproj \
            -scheme ZhengHuoJu \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath build/DerivedData
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/ZhengHuoJu.app

