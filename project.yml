name: ZhengHuoJu
options:
  bundleIdPrefix: com.zhenghuoju
targets:
  ZhengHuoJu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "codemagic.yaml"
          - "project.yml"
          - ".git"
          - "scratch"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhenghuoju.app
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "整活局"
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于将生成的整活卡片保存到相册。"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_ENTITLEMENTS: "ZhengHuoJu.entitlements"
      INFOPLIST_KEY_API_BASE_URL: "https://zhenghuo.miaogou.site"