name: ZhengHuoJu
options:
  bundleIdPrefix: com.zhenghuoju
targets:
  ZhengHuoJu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "codemagic.yaml"
          - "project.yml"
          - ".git"
          - "scratch"
    infoPlist:
      NSPhotoLibraryAddUsageDescription: "用于将生成的整活卡片保存到相册。"
      UILaunchScreen: {}
      CFBundleShortVersionString: "1.0.0"
      CFBundleVersion: "1"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhenghuoju.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
