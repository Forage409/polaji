name: ZhengHuoJu
options:
  bundleIdPrefix: com.zhenghuoju
targets:
  ZhengHuoJu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ContentView.swift
      - path: ZhengHuoJuApp.swift
      - path: Models
      - path: Utils
      - path: Views
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhenghuoju.app
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "整活局"
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于将生成的整活卡片保存到相册。"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_API_BASE_URL: "https://zhenghuo.miaogou.site"
      SWIFT_COMPILATION_MODE: singlefile
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ENABLE_BATCH_MODE: NO
      SWIFT_ENABLE_INCREMENTAL_COMPILATION: NO
      COMPILER_INDEX_STORE_ENABLE: NO
