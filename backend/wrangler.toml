name = "zhenghuoju-backend"
main = "src/index.ts"
compatibility_date = "2023-10-30"

routes = [
  { pattern = "zhenghuo.miaogou.site", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "zhenghuoju-db"
database_id = "4c2bdb28-3cc1-4a41-bed1-c7eef44e1748"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zhenghuoju-images"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ALLOW_DEBUG_VIP = "false"
